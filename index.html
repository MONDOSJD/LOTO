<script>
// si algo falla al arrancar, se muestra el error en pantalla en vez de quedarse en negro
(function(){const errs=[];function show(){let b=document.getElementById('bootErr');if(!b){if(!document.body)return;b=document.createElement('div');b.id='bootErr';b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#fff3f3;color:#900;border:2px solid #c00;border-radius:10px;padding:10px;font:13px/1.35 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto';document.body.appendChild(b)}b.textContent='Error al abrir la app (manda captura):\n'+errs.join('\n')}
window.addEventListener('error',e=>{errs.push((e.message||'error')+' @'+(e.lineno||'')+':'+(e.colno||''));show()});
window.addEventListener('unhandledrejection',e=>{errs.push('promesa: '+(e.reason&&e.reason.message||e.reason));show()});
document.addEventListener('DOMContentLoaded',()=>{if(errs.length)show();setTimeout(()=>{const sp=document.getElementById('splash');if(sp)sp.remove();if(!document.querySelector('#v-inicio .sq')&&!document.body.classList.contains('sub')){errs.push('La pantalla de inicio no se ha dibujado. Versión '+(document.querySelector('meta[name=loto-version]')||{}).content);show()}},6000)});})();
</script>

  for(let k=1;k<=ld;k++){const g=new Date(cur.y,cur.m-1,k).getDay();const ex=d.filter(x=>x.d===k);ex.forEach(x=>{out.push(x);used.add(x)});if(!ex.length&&[1,4,6].includes(g))out.push({d:k,wd:WL[g],fut:true})}

}

function barChart(sel,labels,groups,full){

    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[j]}</text><rect x="${m.l+gw*j}" y="0" width="${gw}" height="${H}" fill="transparent" data-j="${j}"/>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  el.querySelectorAll('rect[data-j]').forEach(r=>{r.addEventListener('pointermove',e=>{const j=+r.dataset.j;showTip(e,`<b>${full[j]}</b>${[0,1,2].map(k=>`<div>${dot(k)} ${P[k]}: <b style="display:inline">${groups[j][k]}</b></div>`).join('')}`)});r.addEventListener('pointerleave',hideTip);r.addEventListener('click',()=>{histYear=full[+r.dataset.j];renderHist()})});

function niceStep(mx,t=5){const raw=mx/t,p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p||1}

async function ghPush(weeks){const tk=ghTok();if(!tk)return false;
  const api=`https://api.github.com/repos/${GH_REPO}/contents/boletos.json`,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
  for(let tries=0;tries<3;tries++){
    let sha=null,cur={};const g=await fetch(api+'?ref=main&t='+Date.now(),{headers:H,cache:'no-store'});
    if(g.status===401||g.status===403){ghState='La clave de GitHub no es válida.';return false}
    if(g.ok){const j=await g.json();sha=j.sha;try{cur=JSON.parse(b64d(j.content))}catch(e){}}
    let ch=false;for(const [k,v] of Object.entries(weeks)){if(JSON.stringify(cur[k])!==JSON.stringify(v)){cur[k]=v;ch=true}}
    if(!ch){ghState='ok';return true}
    const sorted=Object.fromEntries(Object.keys(cur).sort().map(k=>[k,cur[k]]));
    const r=await fetch(api,{method:'PUT',headers:H,body:JSON.stringify({message:'Números de la semana '+Object.keys(weeks).join(', '),content:b64e(JSON.stringify(sorted,null,1)),branch:'main',...(sha?{sha}:{})})});

function applyAuto(){
  meses.length=BASE_N;cur=meses[BASE_N-1];
  meses.forEach(m=>{m.draws=m.draws.filter(x=>!x.auto)});
  const H=getHist(),PT=getPts();let ptCh=false;
  for(const k of Object.keys(OFF).sort()){
    if(k<=LASTX)continue;
    const [y,mo,d]=k.split('-').map(Number);const dt=new Date(y,mo-1,d);
    const bets=(H[weekKey(dt)]||{}).apuestas;let p;
    if(bets&&bets.length>=3){const win=new Set(OFF[k].n);p=[0,1,2].map(i=>bets[i].filter(n=>win.has(n)).length);if(JSON.stringify(PT[k])!==JSON.stringify(p)){PT[k]=p;ptCh=true}}
    else if(PT[k])p=PT[k];else continue;
    let m=meses.find(x=>x.y===y&&x.m===mo);
    if(!m){m={y,m:mo,tot:[0,0,0],draws:[],pago:null};meses.push(m)}
    if(m.draws.some(x=>x.d===d))continue;
    m.draws.push({d,wd:'DLMXJVS'[dt.getDay()],p,auto:true});m.draws.sort((a,b)=>a.d-b.d);
  }
  if(ptCh)try{localStorage.setItem(PKEY,JSON.stringify(PT))}catch(e){}
  meses.forEach((m,i)=>{m.enCurso=i===meses.length-1;if(i>=BASE_N-1)m.tot=[0,1,2].map(j=>m.draws.reduce((s,x)=>s+(+x.p[j]||0),0))});
  cur=meses[meses.length-1];
}

  const worker=await Tesseract.createWorker('eng',1,opts.workerOpts||{});
  try{
    const o=await orient(bmp0,worker,log);

    if(Math.abs(o.a)>=0.75)src=rotCanvas(src,-o.a);
    let res=await core(src,worker,log,15,90);res.k=o.k;
    const ok=r=>r.bets.length>0&&(!r.expected||r.bets.length>=r.expected)&&!r.dudosas.length&&r.reintegro!=null;
    if(!ok(res)){
      for(const a of [-1.5,1.5]){
        const r2=await core(rotCanvas(src,a),worker,log,90,98);
        const sc=r=>r.bets.length*10-r.dudosas.length*5+(r.reintegro!=null?2:0);
        if(sc(r2)>sc(res))res={...r2,k:o.k,reintegro:r2.reintegro??res.reintegro,expected:r2.expected||res.expected};
        if(ok(res))break;
      }
    }
    return res;
  }finally{await worker.terminate()}
}
return {read,parse,_rot:rotCanvas,_skew:skew,_r90:rot90,_gray:toGray};
