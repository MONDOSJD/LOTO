name: Resultados Primitiva
on:
  schedule:
    # Lunes, jueves y sábado a las 23:00 (hora de España en invierno) y reintento a las 23:45 y 08:00
    - cron: '0 22 * * 1,4,6'
    - cron: '45 22 * * 1,4,6'
    - cron: '0 7 * * 2,5,0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resultados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar resultados oficiales
        run: |
          python3 - <<'PY'
          import json, os, re, datetime, urllib.request
          hoy=datetime.date.today()
          ini=(hoy-datetime.timedelta(days=21)).strftime('%Y%m%d'); fin=hoy.strftime('%Y%m%d')
          url=f'https://www.loteriasyapuestas.es/servicios/buscadorSorteos?game_id=LAPR&celebrados=true&fechaInicioInclusiva={ini}&fechaFinInclusiva={fin}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          path='resultados.json'
          res=json.load(open(path)) if os.path.exists(path) else {}
          for s in data:
              comb=s.get('combinacion') or ''
              nums=[int(x) for x in re.findall(r'\b(\d{1,2})\b',comb.split('C(')[0])]
              c=re.search(r'C\((\d+)\)',comb); r=re.search(r'R\((\d)\)',comb)
              if len(nums)!=6: continue
              fecha=s['fecha_sorteo'][:10]
              res[fecha]={'n':sorted(nums),'c':int(c.group(1)) if c else None,'r':int(r.group(1)) if r else None,
                          'bote':s.get('premio_bote'),'escrutinio':[{'tipo':e.get('tipo','').strip(),'cat':e.get('categoria'),'premio':e.get('premio'),'ganadores':e.get('ganadores')} for e in s.get('escrutinio',[])]}
          json.dump(dict(sorted(res.items())),open(path,'w'),ensure_ascii=False,indent=1)
          print(len(data),'sorteos;',len(res),'guardados')
          PY
      - name: Guardar
        run: |
          git config user.name "Loto bot"
          git config user.email "loto-bot@users.noreply.github.com"
          git add resultados.json
          git diff --cached --quiet || (git commit -m "Resultados Primitiva $(date +%F)" && git push)
