body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stab{font:inherit;font-weight:700;font-size:15px;color:var(--text);padding:10px 4px 9px;border-radius:12px;border:1px solid #dcd9d0;background:linear-gradient(180deg,#fff,#efede7);box-shadow:0 4px 0 #cfccc2;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .06s,box-shadow .06s;-webkit-tap-highlight-color:transparent}
.stab span{font-size:12px;font-weight:600;color:var(--text2)}
.stab:active{transform:translateY(3px);box-shadow:0 1px 0 #cfccc2}

.stab.on span{color:#dbe9ff}
#v-mes .pt{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:17px;background:#c9f2d6;color:#0a6a33;font-weight:800;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
#v-mes td.zero{color:#b7b5ae}
#v-hist .sqv{display:inline-flex;align-items:center;justify-content:center;width:46px;height:34px;border-radius:8px;background:#fff;border:1px solid #dedbd2;box-shadow:0 2px 0 #d6d3c9;font-weight:700;color:var(--text)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 14px}
.sq{min-width:0;overflow:hidden;aspect-ratio:1/1;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font:inherit;color:var(--text)}
.sq{background:linear-gradient(180deg,#ffffff 0%,#f6f5f1 55%,#e9e7e0 100%);border:1px solid #dcd9d0;box-shadow:0 6px 0 #cfccc2,0 10px 18px rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.05);transition:transform .07s,box-shadow .07s;-webkit-tap-highlight-color:transparent;margin-bottom:6px}
.sq:active{transform:translateY(5px);box-shadow:0 1px 0 #cfccc2,0 3px 6px rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -2px 4px rgba(0,0,0,.06)}

.sq.k1 .t{font-size:16px;white-space:nowrap}

.sq.k1{padding-top:12px;padding-bottom:12px}
.sq.k1 .ticker{height:26px;margin-top:5px}.sq.k1 .ticker .tk{height:26px;font-size:14px}
.ticker.t3{background:#efe3fb}.ticker.t3 .tk{color:#4b2386;animation-duration:12s}.ticker.t3 .tk b{background:#7c4dcc}
@media (prefers-color-scheme:dark){.ticker.t3{background:#2c2240}.ticker.t3 .tk{color:#ddccf7}}
.semcard h2{font-size:18px}
.semrank{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}

.semrank .sr .pos{font-size:12px;font-weight:800;color:var(--text2)}.semrank .sr .nm{font-weight:700;font-size:15px}.semrank .sr b{font-size:30px;line-height:1.1}
.semrank .sr.g{background:#2fae5a;border-color:#23934a;box-shadow:0 3px 0 #1b7a3c;color:#fff}.semrank .sr.g .pos{color:#d8ffe4}
.semrank .sr.r{background:#e04848;border-color:#c53a3a;box-shadow:0 3px 0 #a52f2f;color:#fff}.semrank .sr.r .pos{color:#ffe0e0}
#v-hist tr.semrow td{background:#f5f2ff}#v-hist tr.semrow td:first-child{font-weight:700;color:#4b2386}
.sq .t{text-shadow:0 1px 0 #fff}
@media (prefers-color-scheme:dark){.sq{background:linear-gradient(180deg,#2a2a28,#1f1f1d);border-color:#333;box-shadow:0 6px 0 #0e0e0d,0 10px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}.sq .t{text-shadow:none}}
.sq svg{width:38px;height:38px}
.sq svg{width:64px;height:64px;align-self:center;margin-top:6px}
.sq{align-items:center;text-align:center}
.sq>div{width:100%}
.ticker{position:relative;overflow:hidden;height:30px;margin-top:8px;background:#e3eefc;border-radius:8px}
.tk{position:absolute;top:0;left:100%;height:30px;display:inline-flex;align-items:center;white-space:nowrap;animation:tk 11s linear infinite;font-size:15px;color:#1d3f6e;font-weight:600}
.tk span{margin:0 6px;display:inline-flex;align-items:center;gap:4px}
.tk b{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:#1d5fbf;color:#fff;font-weight:800;font-size:14px;margin-left:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.tk .sep{color:var(--muted)}
.ticker.t2{background:#fde3d5}

.ticker.t2 .tk b.free{background:#2fae5a}
.ticker.t2 .tk b.max{background:#e04848}
.ticker.t2 .pm{font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.03em}

@media (prefers-color-scheme:dark){.ticker.t2{background:#3a2218}.ticker.t2 .tk{color:#f6c7ae}}
@keyframes tk{0%{left:100%;transform:translateX(0)}70%{left:0;transform:translateX(-100%)}100%{left:0;transform:translateX(-100%)}}
@media (prefers-color-scheme:dark){.ticker{background:#1d2c42}.tk{color:#cfe0f7}}
.sq .t{font-size:18px;font-weight:700}
.sq .d{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.35}

 background:linear-gradient(180deg,#8b7cf0 0%,#6250d6 55%,#5140c2 100%);border:1px solid #4a3ab3;box-shadow:0 5px 0 #392c94,0 9px 14px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:17px}

.sq.fotobar svg{width:30px;height:30px;color:#fff;margin:0}
.sq.wide.col{flex-direction:column;gap:12px;padding:20px 14px 16px}

.dchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.dchip{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:12px;background:linear-gradient(180deg,#fff,#efede7);border:1px solid var(--line);box-shadow:0 3px 0 #d8d5cb}
.dchip span{font-size:12px;color:var(--text2);text-transform:uppercase;font-weight:700;letter-spacing:.04em}

.dchip{position:relative;cursor:pointer;font:inherit;color:var(--text)}
.dchip.on{background:linear-gradient(180deg,#2f86e6,#1d5fbf);border-color:#1a56ad;box-shadow:0 3px 0 #123f80;color:#fff}

.respanel{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}

.acier{margin-left:auto;min-width:30px;text-align:center;font-weight:800;font-size:15px;color:var(--text2)}

.bb{--R:23px;position:relative;flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;background:#f4f2ec;perspective:160px;box-shadow:0 10px 8px -5px rgba(0,0,0,.45),0 2px 2px rgba(0,0,0,.15)}

.bb::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,.55) 12%,rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 48%,rgba(60,50,30,.18) 70%,rgba(40,32,18,.55) 100%);box-shadow:inset -3px -5px 8px rgba(40,30,10,.25),inset 2px 2px 4px rgba(255,255,255,.8)}

.stt{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;letter-spacing:.01em}
.stt.ko{background:linear-gradient(180deg,#f05a5a,#d43a3a);box-shadow:0 3px 0 #a52a2a,0 0 0 3px rgba(224,72,72,.18)}
.stt.ok{background:linear-gradient(180deg,#3df07a,#14c24f);box-shadow:0 3px 0 #0d8f39,0 0 12px rgba(40,230,110,.75);color:#04381a;animation:glow 1.8s ease-in-out infinite}

.row6{display:flex;gap:6px;justify-content:center;width:100%}

 background:radial-gradient(circle at 33% 26%,#ffffff 0,#fdfcf8 14%,#efece3 38%,#d6d1c3 62%,#a9a293 84%,#7d7667 100%);
 box-shadow:0 10px 8px -5px rgba(0,0,0,.45),0 2px 2px rgba(0,0,0,.15),inset -4px -6px 9px rgba(60,50,30,.22),inset 3px 3px 5px rgba(255,255,255,.95)}

.badge.bad{background:var(--bad);color:#fff}.badge.good{background:var(--good);color:#fff}
.hero{font-size:15px;color:var(--text2);margin:0 0 12px}
.hero b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--grid);font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
td.lo{color:var(--bad);font-weight:700}
td.hi{color:var(--good);font-weight:700}
.scroll{overflow-x:auto}
select,input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--text2);border:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;align-items:end}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form input{width:100%}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:none;color:var(--text);font:inherit;font-size:18px;width:34px;height:38px;cursor:pointer}
.stepper span{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:3}
.tip b{display:block;margin-bottom:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:14px}
.list li:last-child{border-bottom:0}
.list .meta{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--accent);opacity:.85}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--text2)}
.kv div:nth-child(even){font-weight:600;text-align:right}
.mine{font-size:11px;color:var(--accent);font-weight:700}
@media (max-width:560px){.tile .big{font-size:28px}.form{grid-template-columns:1fr 1fr}main{padding:12px}}
</style>

<script>
(function(){
const D=window.LOTO_DATA, P=D.jugadores, N=P.length;
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIA={L:'Lun',M:'Mar',X:'Mié',J:'Jue',V:'Vie',S:'Sáb',D:'Dom'};
const col=i=>`var(--p${i})`;
const dot=i=>`<span class="dot" style="background:${col(i)}"></span>`;
const $=s=>document.querySelector(s);
const STORE='loto.local.v1';
let local={};try{local=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify(local))}catch(e){}}

// merge local draws into data
const meses=D.meses.map(m=>Object.assign({},m,{draws:m.draws.slice()}));
let cur=meses[meses.length-1];
const BASE_N=meses.length;
const LASTX=(()=>{const m=meses[meses.length-1];const d=Math.max(0,...m.draws.map(x=>x.d||0));return `${m.y}-${String(m.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`})();
function curDraws(){const extra=(local.draws||[]).map(x=>Object.assign({mine:true},x));return cur.draws.concat(extra).sort((a,b)=>a.d-b.d)}
function recalcCur(){const d=curDraws();cur.tot=[0,1,2].map(i=>d.reduce((s,x)=>s+(+x.p[i]||0),0))}
recalcCur();
const label=m=>(m.label||MES[m.m-1]);

// who pays: the lowest score; ties -> several
function lows(t){const mn=Math.min(...t);return t.map((v,i)=>v===mn?i:-1).filter(i=>i>=0)}
function highs(t){const mx=Math.max(...t);return t.map((v,i)=>v===mx?i:-1).filter(i=>i>=0)}
function payer(m){const l=lows(m.tot);return l.length===1?l[0]:(l.length===N?'all':l)}
// reparto: 1º no paga, 2º paga 1/3, 3º paga 2/3 (empates: se reparten a partes iguales)
const SH=[0,1/3,2/3];
function shares(m){const o=[0,1,2].sort((a,b)=>m.tot[b]-m.tot[a]);const r=[0,0,0];let k=0;while(k<3){let j=k;while(j+1<3&&m.tot[o[j+1]]===m.tot[o[k]])j++;let sum=0;for(let q=k;q<=j;q++)sum+=SH[q];for(let q=k;q<=j;q++)r[o[q]]=sum/(j-k+1);k=j+1}return r}
function frac(v){const t=[[0,'0'],[1/6,'1/6'],[1/3,'1/3'],[1/2,'1/2'],[2/3,'2/3'],[1,'1']];let b=t[0];t.forEach(x=>{if(Math.abs(x[0]-v)<Math.abs(b[0]-v))b=x});return b[1]}
function payTxt(m,sep='<br>',noDot){const sh=shares(m);return [0,1,2].filter(i=>sh[i]>1e-9).sort((a,b)=>sh[b]-sh[a]).map(i=>`<span style="white-space:nowrap">${noDot?'':dot(i)+' '}<b>${P[i]}</b> ${frac(sh[i])}</span>`).join(sep)}
const f1=v=>(Math.round(v*10)/10).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});

const closed=()=>meses.filter(m=>!m.enCurso);
const semOf=m=>m.m<=6?1:2;
function semData(y,h){const ms=meses.filter(m=>m.y===y&&semOf(m)===h);return {ms,tot:[0,1,2].map(i=>ms.reduce((s,m)=>s+(+m.tot[i]||0),0))}}
const semName=(y,h)=>`${h}º semestre ${y}`;
// ---------- ESTE MES ----------
function renderMes(){
  recalcCur();
  const t=cur.tot, lo=lows(t), hi=highs(t), d=curDraws();
  const order=[0,1,2].sort((a,b)=>t[b]-t[a]);
  let heroTxt;
  if(hi.length===N) heroTxt='Ahora mismo vais <b>empatados los tres</b>.';
  else if(hi.length>1) heroTxt=`Van primeros <b>${hi.map(i=>P[i]).join(' y ')}</b>, empatados.`;
  else {const gap=t[hi[0]]-Math.max(...t.filter((v,i)=>i!==hi[0]));heroTxt=`Va primero <b>${P[hi[0]]}</b>, con ${gap} punto${gap===1?'':'s'} de ventaja.`}
  const pend=pendientes();
  $("#v-mes").innerHTML=`
  <div class="card">
    <div class="tiles">${order.map(i=>`
      <div class="tile ${hi.length<N&&hi.includes(i)?'lead':''}">
        <div class="name">${P[i]}</div>
        <div class="big">${t[i]}</div>
        <div class="sub">puntos</div>
        ${hi.length<N&&hi.includes(i)?'<span class="badge good">Líder</span>':''}
      </div>`).join('')}</div>
  </div>
  ${(()=>{const h=semOf(cur),S=semData(cur.y,h),st=S.tot,so=[0,1,2].sort((a,b)=>st[b]-st[a]),sh=highs(st),sl=lows(st);
    return `<div class="card semcard"><h2>${semName(cur.y,h).toUpperCase()}</h2>
    <div class="semrank">${so.map((i,k)=>`<div class="sr ${sh.length<N&&sh.includes(i)?'g':sl.length<N&&sl.includes(i)?'r':''}"><span class="pos">${k+1}º</span><span class="nm">${P[i]}</span><b>${st[i]}</b></div>`).join('')}</div>
    <div class="scroll"><table><thead><tr><th>Mes</th>${P.map((p,i)=>`<th>${D.corto[i]}</th>`).join('')}</tr></thead><tbody>
    ${S.ms.map(m=>`<tr><td>${label(m)}${m.enCurso?' <span style="color:var(--muted);font-size:11px">en curso</span>':''}</td>${m.tot.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`})()}
  <div class="card">
    <h2>Sorteos de ${label(cur).toUpperCase()}</h2>
    <div class="scroll"><table><thead><tr><th>Día</th>${P.map((p,i)=>`<th>${D.corto[i]}</th>`).join('')}<th></th></tr></thead>
    <tbody>${d.slice().reverse().map(x=>{const mx=Math.max(...x.p);return `<tr><td>${DIA[x.wd]||''} ${x.d} ${x.mine?'<span class="mine">nuevo</span>':''}</td>${x.p.map(v=>v>0?`<td><span class="pt">${v}</span></td>`:`<td class="zero">${v}</td>`).join('')}<td>${x.mine?`<button class="btn ghost" data-del="${x.id}" style="padding:4px 8px;font-size:12px">Quitar</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
  </div>
  `;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{local.draws=(local.draws||[]).filter(x=>x.id!=b.dataset.del);saveLocal();renderAll()});
}
function nextDay(d){const last=d.length?d[d.length-1].d:0;for(let k=last+1;k<=31;k++){const g=new Date(cur.y,cur.m-1,k);if(g.getMonth()!==cur.m-1)break;if([1,4,6].includes(g.getDay()))return k}return last+1}
function whoTxt(p){return p==='all'?'Triple empate':Array.isArray(p)?'Empate '+p.map(i=>P[i]).join('/'):`${dot(p)} <b>${P[p]}</b>`}
function pendientes(){
  // from 2021 on, months without registered dinner
  return closed().filter(m=>m.y>=2021&&!m.pago);
}
function legend(){return `<div class="legend">${P.map((p,i)=>`<span>${dot(i)}${p}</span>`).join('')}</div>`}

// ---------- CLASIFICACIÓN ----------
let clFilter='all';
function inFilter(m){
  if(clFilter==='all')return true;
  if(clFilter==='nuevo')return m.y>2022||(m.y===2022&&m.m>=9);
  if(clFilter==='viejo')return m.y<2022||(m.y===2022&&m.m<9);
  return m.y===+clFilter;
}
function stats(ms){
  const s=P.map(()=>({pts:0,pago:0,ult:0,gana:0,meses:0,draws:0,dpts:0,best:null,worst:null}));
  ms.forEach(m=>{
    const h=highs(m.tot),l=lows(m.tot),sh=shares(m);
    m.tot.forEach((v,i)=>{s[i].pts+=v;s[i].meses++;s[i].pago+=sh[i];});
    if(h.length===1)s[h[0]].gana++;
    if(l.length===1)s[l[0]].ult++;
    m.draws.forEach(x=>x.p.forEach((v,i)=>{if(typeof v==='number'){s[i].draws++;s[i].dpts+=v}}));
  });
  // racha sin quedar último
  P.forEach((_,i)=>{const isLast=m=>{const l=lows(m.tot);return l.length===1&&l[0]===i};let run=0,best=0;ms.forEach(m=>{if(isLast(m))run=0;else{run++;best=Math.max(best,run)}});s[i].racha=best;
    let cr=0;for(let k=ms.length-1;k>=0;k--){if(isLast(ms[k]))break;cr++}s[i].rachaAct=cr;});
  return s;
}
function renderClasif(){
  const ms=closed().filter(inFilter); const s=stats(ms);
  const years=[...new Set(meses.map(m=>m.y))].reverse();
  const ord=[0,1,2].sort((a,b)=>s[a].pago-s[b].pago||s[b].pts-s[a].pts);
  const maxPago=Math.max(...s.map(x=>x.pago),1);
  // records
  let rec={hiM:null,loM:null};ms.forEach(m=>m.tot.forEach((v,i)=>{if(m.draws.length||m.y>=2022){}}));
  const recMonth=(fn)=>{let r=null;ms.forEach(m=>m.tot.forEach((v,i)=>{if(!r||fn(v,r.v))r={v,i,m}}));return r};
  const eraOld=ms.filter(m=>m.y<2022||(m.y===2022&&m.m<9)), eraNew=ms.filter(m=>!(m.y<2022||(m.y===2022&&m.m<9)));
  const pick=arr=>arr.length?{hi:(()=>{let r=null;arr.forEach(m=>m.tot.forEach((v,i)=>{if(!r||v>r.v)r={v,i,m}}));return r})(),lo:(()=>{let r=null;arr.forEach(m=>m.tot.forEach((v,i)=>{if(!r||v<r.v)r={v,i,m}}));return r})()}:null;
  const rOld=pick(eraOld), rNew=pick(eraNew);
  $("#v-clasif").innerHTML=`
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">Cenas pagadas <small>${ms.length} meses</small></h2>
      <select id="clSel">
        <option value="all">Todo (desde 2010)</option>
        <option value="viejo">Formato antiguo (hasta jul 2022)</option>
        <option value="nuevo">Formato actual (desde sep 2022)</option>
        ${years.map(y=>`<option value="${y}">${y}</option>`).join('')}
      </select>
    </div>
    <div class="tiles">${ord.map((i,k)=>`
      <div class="tile ${k===2?'pays':''} ${k===0?'lead':''}">
        <div class="name">${dot(i)}${P[i]}</div>
        <div class="big">${f1(s[i].pago)}</div>
        <div class="sub">cenas pagadas</div>
      </div>`).join('')}</div>
  </div>
  <div class="card">
    <h2>Números</h2>
    <div class="scroll"><table>
      <thead><tr><th></th>${P.map((p,i)=>`<th>${dot(i)} ${D.corto[i]}</th>`).join('')}</tr></thead>
      <tbody>
        ${row('Cenas pagadas',s.map(x=>f1(x.pago)),'lo-hi')}
        ${row('Veces 1º (no paga)',s.map(x=>x.gana),'hi')}
        ${row('Veces último (2/3)',s.map(x=>x.ult),'lo-hi')}
        ${row('Puntos totales',s.map(x=>x.pts),'hi')}
        ${row('Media por mes',s.map(x=>x.meses?(x.pts/x.meses).toFixed(1):'–'),'hi')}
        ${row('Media por sorteo',s.map(x=>x.draws?(x.dpts/x.draws).toFixed(2):'–'),'hi')}
        ${row('Racha sin ser último (récord)',s.map(x=>x.racha+' m'),'hi')}

function row(name,vals,mode){
  const nums=vals.map(v=>parseFloat(String(v).replace(',','.')));const mx=Math.max(...nums),mn=Math.min(...nums);

}

function applyAuto(){

  const H=getHist();
  for(const k of Object.keys(OFF).sort()){
    if(k<=LASTX)continue;
    const [y,mo,d]=k.split('-').map(Number);const dt=new Date(y,mo-1,d);
    const bets=(H[weekKey(dt)]||{}).apuestas;if(!bets||bets.length<3)continue;
    const win=new Set(OFF[k].n);const p=[0,1,2].map(i=>bets[i].filter(n=>win.has(n)).length);
    let m=meses.find(x=>x.y===y&&x.m===mo);
    if(!m){m={y,m:mo,tot:[0,0,0],draws:[],pago:null};meses.push(m)}
    if(m.draws.some(x=>x.d===d))continue;

    <button class="sq k6 wide col" data-go="semana">${ic.semana}<div><div class="t">Números para esta semana</div>${(()=>{const b=curBol();return b&&b.apuestas.length?'<span class="stt ok">✓ Números disponibles</span>':'<span class="stt ko">⚠ Sin números aún</span>'})()}</div></button>
    <button class="sq k5 fotobar" data-go="boleto">${ic.boleto}<span>Hacer foto del boleto</span></button>
    <button class="sq k1" data-go="mes">${ic.mes}<div style="min-width:0"><div class="t">${label(cur)} ${cur.y}</div><div class="ticker"><div class="tk">${tk}</div></div><div class="ticker t3"><div class="tk">${tkS}</div></div></div></button>
    <button class="sq k2" data-go="clasif">${ic.clasif}<div><div class="t">Clasificación</div><div class="d">Menos cenas pagadas: ${lider.map(i=>P[i]).join(' y ')}</div></div></button>
    <button class="sq k3" data-go="hist">${ic.hist}<div><div class="t">Histórico</div><div class="d">Desde ${MES[meses[0].m-1].toLowerCase()} ${meses[0].y}, año a año</div></div></button>
    <button class="sq k4" data-go="cenas">${ic.cenas}<div style="min-width:0"><div class="t">Cenas</div>${pend.length?`<div class="ticker t2"><div class="tk">${(()=>{const m=pend[0],sh=shares(m);const mx=Math.max(...sh);const ord=[0,1,2].sort((a,b)=>sh[a]-sh[b]);return `<span class="pc">Próxima cena a pagar:</span><span class="pm">${label(m)}/${String(m.y).slice(2)}</span>`+ord.map(i=>`<span>${P[i]} <b class="${sh[i]<1e-9?'free':(Math.abs(sh[i]-mx)<1e-9?'max':'mid')}">${sh[i]<1e-9?'0':frac(sh[i])}</b></span>`).join('')})()}</div></div>`:'<div class="d">Ninguna pendiente</div>'}</div></button>
    <button class="sq k7" data-go="saldos">${ic.saldos}<div><div class="t">Saldos</div><div class="d">Próximamente</div></div></button>
    <button class="sq k8" data-go="premios">${ic.premios}<div><div class="t">Premios</div><div class="d">Próximamente</div></div></button>

  </div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go});
}
// ---------- nav ----------
const R={saldos:()=>{$('#v-saldos').innerHTML='<div class="card"><p class="note" style="margin:0;font-size:15px">Aquí irán los saldos. Próximamente.</p></div>'},premios:()=>{$('#v-premios').innerHTML='<div class="card"><p class="note" style="margin:0;font-size:15px">Aquí irán los premios. Próximamente.</p></div>'},semana:renderSemana,boleto:renderBoleto,inicio:renderInicio,mes:renderMes,clasif:renderClasif,hist:renderHist,cenas:renderCenas};
let view='inicio';
const TT={saldos:'Saldos',premios:'Premios',semana:'Números de la semana',boleto:'Boleto',mes:'',clasif:'Clasificación',hist:'Histórico',cenas:'Cenas'};
function show(v){view=v;$('#hx').innerHTML='';$('#ttl').textContent=v==='mes'?`${label(cur).toUpperCase()} ${cur.y}`:(TT[v]||'');document.body.classList.toggle('sub',v!=='inicio');document.querySelectorAll('section').forEach(s=>s.classList.toggle("on",s.id==="v-"+v));R[v]();scrollTo(0,0)}
function renderAll(){R[view]()}
$('#back').onclick=()=>{if(history.length>1&&view!=='inicio'&&sessionStorage.getItem('lotoNav'))history.back();else location.hash='inicio'};
addEventListener('hashchange',()=>{try{sessionStorage.setItem('lotoNav','1')}catch(e){}const h=location.hash.slice(1);show(R[h]?h:'inicio')});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderAll,150)});
show('inicio');if(location.hash&&location.hash!=='#inicio')history.replaceState(null,'',location.pathname+location.search);
})();
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});let _r=0;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!_r){_r=1;location.reload()}});}
(function(){const V=document.querySelector('meta[name="loto-version"]').content;let busy=0;
async function check(){if(busy)return;busy=1;try{const t=await fetch(location.pathname+'?ver='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'');const m=t.match(/name="loto-version" content="(\d+)"/);if(m&&m[1]!==V){document.body.style.transition='opacity .3s';document.body.style.opacity='0';setTimeout(()=>location.reload(),300);return}}catch(e){}busy=0}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
addEventListener('focus',check);setInterval(check,60000);setTimeout(check,3000);})();
</script>
